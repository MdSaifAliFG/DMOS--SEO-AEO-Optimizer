# ==========================================
# DMOS SEO & AEO Platform — Render Blueprint
# ==========================================
services:
  # FastAPI Crawler & Audit Backend Service
  - type: web
    name: dmos-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        # Async app URL (psycopg3). Wire to a managed Postgres; never SQLite in deployment.
        value: postgresql+psycopg://dmos_user:CHANGE_ME@postgres:5432/dmos_seo_aeo
      - key: SYNC_DATABASE_URL
        value: postgresql://dmos_user:CHANGE_ME@postgres:5432/dmos_seo_aeo
      - key: SKIP_STARTUP_DDL
        value: true
      - key: CORS_ORIGINS
        value: '["https://rank.zobay.in"]'
      - key: CRAWL_MAX_PAGES
        value: "50"
      - key: CRAWL_CONCURRENCY
        value: "5"
      - key: SECRET_KEY
        generateValue: true
