# Copy to secret.yaml, fill values, apply with: kubectl apply -f secret.yaml -n rank-dev
# NEVER commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: rank-api-secrets
  namespace: rank-dev
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://USER:PASS@postgres-host:5432/rank_dev"
  SYNC_DATABASE_URL: "postgresql://USER:PASS@postgres-host:5432/rank_dev"
  SECRET_KEY: "CHANGE_ME_long_random_value"
  DEV_AUTH_SECRET: "CHANGE_ME_dev_only"
  CORS_ORIGINS: '["https://dev.rank.zobay.in"]'
  GEMINI_API_KEY: ""
